name: DebtRadar Quality & Security Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master, develop]

jobs:
  debtradar-gate:
    name: DebtRadar Architecture & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit || true

      - name: DebtRadar Static Security Scan
        id: security-scan
        run: |
          echo "=========================================="
          echo "  DebtRadar Risk Intelligence Gate v1.0  "
          echo "=========================================="
          echo ""
          echo "Repository : ${{ github.repository }}"
          echo "Commit SHA : ${{ github.sha }}"
          echo "Branch     : ${{ github.ref_name }}"
          echo ""

          CRITICAL_VULNS=0
          WARNINGS=0
          FINDINGS=""

          # Dirs to always skip
          SKIP_DIRS="node_modules|.next|dist|.git|tests|__tests__|.cache"

          # --- Rule 1: Hardcoded secrets / API keys ---
          echo "Scanning for hardcoded secrets..."
          SECRET_HITS=$(find . -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.js" -o -name "*.jsx" \) \
            | grep -vE "$SKIP_DIRS" \
            | xargs grep -lE "(api_key|apikey|secret|password|token)\s*=\s*['\"][^'\"]{8,}" 2>/dev/null \
            | xargs grep -hE "(api_key|apikey|secret|password|token)\s*=\s*['\"][^'\"]{8,}" 2>/dev/null \
            | grep -ivE "process\.env|secrets\.|placeholder|example|test|mock|dummy|fake|\.env\." \
            | wc -l)
          if [ "$SECRET_HITS" -gt 0 ]; then
            CRITICAL_VULNS=$((CRITICAL_VULNS + 1))
            FINDINGS="${FINDINGS}  - CRITICAL: Possible hardcoded secrets detected ($SECRET_HITS occurrences)\n"
          else
            FINDINGS="${FINDINGS}  - PASS: No hardcoded secrets found\n"
          fi

          # --- Rule 2: eval() in production source (not tests, not string literals) ---
          echo "Scanning for dangerous eval() usage..."
          # Only scan lib/ and app/ - these are real production files
          EVAL_HITS=$(find . -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.js" \) \
            | grep -E "^\./lib/|^\./app/" \
            | grep -vE "harness|autofix|fixtures|spec\.|test\." \
            | xargs grep -hE "\beval\s*\(" 2>/dev/null \
            | grep -vE "containsAny|\.includes\(|'eval\(|\"eval\(|\`eval\(" \
            | grep -vE "^[[:space:]]*(//|/\*|\*)" \
            | wc -l)
          if [ "$EVAL_HITS" -gt 0 ]; then
            CRITICAL_VULNS=$((CRITICAL_VULNS + 1))
            FINDINGS="${FINDINGS}  - CRITICAL: eval() usage detected in production code ($EVAL_HITS occurrences)\n"
          else
            FINDINGS="${FINDINGS}  - PASS: No dangerous eval() usage found\n"
          fi

          # --- Rule 3: console.log count in API routes ---
          echo "Scanning for excessive debug logging in API routes..."
          if [ -d "app/api" ]; then
            LOG_HITS=$(find app/api -name "*.ts" -o -name "*.tsx" \
              | xargs grep -h "console\.log" 2>/dev/null | wc -l)
          else
            LOG_HITS=0
          fi
          if [ "$LOG_HITS" -gt 50 ]; then
            WARNINGS=$((WARNINGS + 1))
            FINDINGS="${FINDINGS}  - WARNING: $LOG_HITS console.log statements in API routes\n"
          else
            FINDINGS="${FINDINGS}  - PASS: console.log usage in API routes is acceptable ($LOG_HITS)\n"
          fi

          # --- Rule 4: Auth enforcement coverage ---
          echo "Checking auth enforcement in API routes..."
          if [ -d "app/api" ]; then
            API_FILES=$(find app/api -name "route.ts" | wc -l)
            AUTH_FILES=$(find app/api -name "route.ts" \
              | xargs grep -lE "Authorization|createClient|getSession|verifyApiKey|validateKey" 2>/dev/null \
              | wc -l)
            AUTH_RATIO=0
            if [ "$API_FILES" -gt 0 ]; then
              AUTH_RATIO=$(( (AUTH_FILES * 100) / API_FILES ))
            fi
          else
            AUTH_RATIO=100
          fi
          if [ "$AUTH_RATIO" -lt 15 ]; then
            WARNINGS=$((WARNINGS + 1))
            FINDINGS="${FINDINGS}  - WARNING: Only ${AUTH_RATIO}% of API routes enforce auth checks\n"
          else
            FINDINGS="${FINDINGS}  - PASS: Auth enforcement coverage: ${AUTH_RATIO}%\n"
          fi

          # --- Rule 5: .env files committed ---
          echo "Checking for committed .env files..."
          ENV_HITS=$(git ls-files | grep -cE "^\.env(\.|$)" || true)
          if [ "$ENV_HITS" -gt 0 ]; then
            CRITICAL_VULNS=$((CRITICAL_VULNS + 1))
            FINDINGS="${FINDINGS}  - CRITICAL: .env file(s) tracked by git!\n"
          else
            FINDINGS="${FINDINGS}  - PASS: No .env files committed\n"
          fi

          # --- Compute trust score ---
          TRUST_SCORE=$(( 100 - (CRITICAL_VULNS * 30) - (WARNINGS * 5) ))
          if [ "$TRUST_SCORE" -lt 0 ]; then TRUST_SCORE=0; fi

          # --- Print report ---
          echo ""
          echo "=========================================="
          echo "  SCAN FINDINGS"
          echo "=========================================="
          printf "%b" "$FINDINGS"
          echo ""
          echo "=========================================="
          echo "  GATE SUMMARY"
          echo "=========================================="
          echo "  Trust Score       : $TRUST_SCORE / 100"
          echo "  Critical Issues   : $CRITICAL_VULNS"
          echo "  Warnings          : $WARNINGS"
          echo "=========================================="
          echo ""

          # --- Gate decision ---
          if [ "$CRITICAL_VULNS" -gt 0 ]; then
            echo "FAILED: DebtRadar Quality Gate — $CRITICAL_VULNS critical issue(s) must be resolved."
            exit 1
          elif [ "$TRUST_SCORE" -lt 60 ]; then
            echo "FAILED: DebtRadar Quality Gate — Trust score ($TRUST_SCORE) below threshold (60)."
            exit 1
          else
            echo "PASSED: DebtRadar Quality Gate — Trust Score: $TRUST_SCORE/100"
            exit 0
          fi

      - name: Build Verification
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
