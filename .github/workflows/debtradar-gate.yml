name: DebtRadar Quality & Security Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master, develop]

jobs:
  debtradar-gate:
    name: DebtRadar Architecture & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit || true

      - name: DebtRadar Static Security Scan
        id: security-scan
        run: |
          echo "=========================================="
          echo "  DebtRadar Risk Intelligence Gate v1.0  "
          echo "=========================================="
          echo ""
          echo "Repository : ${{ github.repository }}"
          echo "Commit SHA : ${{ github.sha }}"
          echo "Branch     : ${{ github.ref_name }}"
          echo ""

          CRITICAL_VULNS=0
          WARNINGS=0
          FINDINGS=""

          # --- Rule 1: Hardcoded secrets / API keys ---
          echo "🔍 Scanning for hardcoded secrets..."
          SECRET_HITS=$(grep -rn \
            --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" \
            -E "(api_key|apikey|secret|password|token)\s*=\s*['\"][^'\"]{8,}" \
            --exclude-dir={node_modules,.next,dist,.git} . 2>/dev/null | \
            grep -iv "process\.env\|secrets\.\|placeholder\|example\|test\|mock\|dummy\|fake" | wc -l)
          if [ "$SECRET_HITS" -gt 0 ]; then
            CRITICAL_VULNS=$((CRITICAL_VULNS + 1))
            FINDINGS="${FINDINGS}\n  ❌ CRITICAL: Possible hardcoded secrets detected ($SECRET_HITS occurrences)"
          else
            FINDINGS="${FINDINGS}\n  ✅ No hardcoded secrets found"
          fi

          # --- Rule 2: SQL injection surface (raw query strings) ---
          echo "🔍 Scanning for SQL injection patterns..."
          SQL_HITS=$(grep -rn \
            --include="*.ts" --include="*.tsx" --include="*.js" \
            -E "query\s*\(\s*['\`].*\$\{" \
            --exclude-dir={node_modules,.next,dist,.git} . 2>/dev/null | wc -l)
          if [ "$SQL_HITS" -gt 5 ]; then
            WARNINGS=$((WARNINGS + 1))
            FINDINGS="${FINDINGS}\n  ⚠️  WARNING: Possible interpolated SQL strings ($SQL_HITS occurrences — verify parameterization)"
          else
            FINDINGS="${FINDINGS}\n  ✅ SQL injection surface looks clean"
          fi

          # --- Rule 3: eval() / dangerous execution ---
          echo "🔍 Scanning for dangerous eval() usage..."
          EVAL_HITS=$(grep -rn \
            --include="*.ts" --include="*.tsx" --include="*.js" \
            -E "\beval\s*\(" \
            --exclude-dir={node_modules,.next,dist,.git} . 2>/dev/null | wc -l)
          if [ "$EVAL_HITS" -gt 0 ]; then
            CRITICAL_VULNS=$((CRITICAL_VULNS + 1))
            FINDINGS="${FINDINGS}\n  ❌ CRITICAL: eval() usage detected ($EVAL_HITS occurrences)"
          else
            FINDINGS="${FINDINGS}\n  ✅ No eval() usage found"
          fi

          # --- Rule 4: console.log in production API routes ---
          echo "🔍 Scanning for debug console.log in API routes..."
          LOG_HITS=$(grep -rn \
            --include="*.ts" --include="*.tsx" \
            "console\.log" \
            app/api/ 2>/dev/null | wc -l)
          if [ "$LOG_HITS" -gt 10 ]; then
            WARNINGS=$((WARNINGS + 1))
            FINDINGS="${FINDINGS}\n  ⚠️  WARNING: $LOG_HITS console.log statements in API routes (consider structured logging)"
          else
            FINDINGS="${FINDINGS}\n  ✅ console.log usage in API routes is acceptable ($LOG_HITS)"
          fi

          # --- Rule 5: Missing CORS / auth headers ---
          echo "🔍 Checking auth enforcement in API routes..."
          API_FILES=$(find app/api -name "route.ts" 2>/dev/null | wc -l)
          AUTH_FILES=$(grep -rl "Authorization\|createClient\|getSession\|verifyApiKey\|validateKey" \
            app/api/ 2>/dev/null | wc -l)
          AUTH_RATIO=0
          if [ "$API_FILES" -gt 0 ]; then
            AUTH_RATIO=$(( (AUTH_FILES * 100) / API_FILES ))
          fi
          if [ "$AUTH_RATIO" -lt 30 ]; then
            WARNINGS=$((WARNINGS + 1))
            FINDINGS="${FINDINGS}\n  ⚠️  WARNING: Only $AUTH_RATIO% of API routes enforce auth checks"
          else
            FINDINGS="${FINDINGS}\n  ✅ Auth enforcement coverage: $AUTH_RATIO%"
          fi

          # --- Rule 6: .env files accidentally staged ---
          echo "🔍 Checking for committed .env files..."
          ENV_HITS=$(git ls-files | grep -E "^\.env(\.|$)" | wc -l)
          if [ "$ENV_HITS" -gt 0 ]; then
            CRITICAL_VULNS=$((CRITICAL_VULNS + 1))
            FINDINGS="${FINDINGS}\n  ❌ CRITICAL: .env file(s) tracked by git!"
          else
            FINDINGS="${FINDINGS}\n  ✅ No .env files committed"
          fi

          # --- Compute trust score ---
          TRUST_SCORE=$(( 100 - (CRITICAL_VULNS * 30) - (WARNINGS * 5) ))
          if [ "$TRUST_SCORE" -lt 0 ]; then TRUST_SCORE=0; fi

          # --- Print report ---
          echo ""
          echo "=========================================="
          echo "  SCAN FINDINGS"
          echo "=========================================="
          echo -e "$FINDINGS"
          echo ""
          echo "=========================================="
          echo "  GATE SUMMARY"
          echo "=========================================="
          echo "  Trust Score       : $TRUST_SCORE / 100"
          echo "  Critical Issues   : $CRITICAL_VULNS"
          echo "  Warnings          : $WARNINGS"
          echo "=========================================="
          echo ""

          # --- Gate decision ---
          if [ "$CRITICAL_VULNS" -gt 0 ]; then
            echo "❌ DebtRadar Quality Gate FAILED — $CRITICAL_VULNS critical issue(s) must be resolved."
            exit 1
          elif [ "$TRUST_SCORE" -lt 60 ]; then
            echo "❌ DebtRadar Quality Gate FAILED — Trust score ($TRUST_SCORE) below threshold (60)."
            exit 1
          else
            echo "✅ DebtRadar Quality Gate PASSED — Trust Score: $TRUST_SCORE/100"
            exit 0
          fi

      - name: Build Verification
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
